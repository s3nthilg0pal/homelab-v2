---
- name: Deploy Gym API
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/gym-api"
    pull: always
    state: present

- name: Deploy SenthilIndex API
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/senthilindex"
    pull: always
    state: present

- name: Deploy Movie Grabber API
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/movie-grabber"
    pull: always
    state: present
