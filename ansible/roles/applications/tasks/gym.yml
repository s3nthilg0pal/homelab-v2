---
- name: Create Gym API directory
  ansible.builtin.file:
    path: "{{ apps_root }}/gym-api"
    state: directory
    owner: senthil
    group: docker
    mode: "0750"

- name: Install Gym Compose definition
  ansible.builtin.template:
    src: gym-compose.yml.j2
    dest: "{{ apps_root }}/gym-api/compose.yml"
    owner: senthil
    group: docker
    mode: "0640"
  notify: Deploy Gym API

- name: Install Gym environment
  ansible.builtin.template:
    src: gym.env.j2
    dest: "{{ apps_root }}/gym-api/.env"
    owner: senthil
    group: docker
    mode: "0640"
  no_log: true
  notify: Deploy Gym API

- name: Deploy changed Gym API now
  ansible.builtin.meta: flush_handlers
