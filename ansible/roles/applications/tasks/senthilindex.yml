---
- name: Create SenthilIndex API directory
  ansible.builtin.file:
    path: "{{ apps_root }}/senthilindex"
    state: directory
    owner: senthil
    group: docker
    mode: "0750"

- name: Install SenthilIndex Compose definition
  ansible.builtin.template:
    src: senthilindex-compose.yml.j2
    dest: "{{ apps_root }}/senthilindex/compose.yml"
    owner: senthil
    group: docker
    mode: "0640"
  notify: Deploy SenthilIndex API

- name: Install SenthilIndex environment
  ansible.builtin.template:
    src: senthilindex.env.j2
    dest: "{{ apps_root }}/senthilindex/.env"
    owner: senthil
    group: docker
    mode: "0640"
  no_log: true
  notify: Deploy SenthilIndex API

- name: Deploy changed SenthilIndex API now
  ansible.builtin.meta: flush_handlers
