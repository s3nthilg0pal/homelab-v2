---
- name: Install Docker and Compose from Debian
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true

- name: Start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Allow deployment user to use Docker
  ansible.builtin.user:
    name: senthil
    groups: docker
    append: true

